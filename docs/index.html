<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タイピングゲーム</title>
    <style>
        body { text-align: center; font-family: Arial, sans-serif; }
        #word { font-size: 24px; font-weight: bold; margin: 20px; display: none; }
        #romaji { font-size: 20px; color: gray; display: none; }
        #input { font-size: 18px; padding: 5px; display: none; }
        #startMessage { font-size: 20px; color: red; }
    </style>
</head>
<body>
    <h1>タイピングゲーム</h1>
    <p id="startMessage">スペースキーを押してゲームを開始</p>
    <p>表示される単語のローマ字を正しく入力してください</p>
    <div id="word">準備中...</div>
    <div id="romaji"></div>
    <input type="text" id="input" autofocus>
    <p>スコア: <span id="score">0</span></p>
    <p>残り時間: <span id="timer">120</span>秒</p>
    
    <script>
        const words = [
            { kanji: "寿司", romaji: "sushi" },
            { kanji: "天ぷら", romaji: "tenpura" },
            { kanji: "ラーメン", romaji: "ra-men" },
            { kanji: "うどん", romaji: "udon" },
            { kanji: "そば", romaji: "soba" },
            { kanji: "おにぎり", romaji: "onigiri" }
        ];
        let currentWord = {};
        let score = 0;
        let timeLeft = 120;
        let gameStarted = false;
        let timerInterval;

        function newWord() {
            currentWord = words[Math.floor(Math.random() * words.length)];
            document.getElementById("word").textContent = currentWord.kanji;
            document.getElementById("romaji").textContent = currentWord.romaji;
            document.getElementById("input").value = "";
        }

        function updateTimer() {
            if (timeLeft > 0) {
                timeLeft--;
                document.getElementById("timer").textContent = timeLeft;
            } else {
                clearInterval(timerInterval);
                window.location.href = `result.html?score=${score}`;
            }
        }

        function startGame() {
            if (!gameStarted) {
                gameStarted = true;
                document.getElementById("startMessage").style.display = "none";
                document.getElementById("word").style.display = "block";
                document.getElementById("romaji").style.display = "block";
                document.getElementById("input").style.display = "block";
                document.getElementById("input").focus();
                newWord();
                timerInterval = setInterval(updateTimer, 1000);
            }
        }

        document.addEventListener("keydown", function(event) {
            if (event.code === "Space") {
                startGame();
            }
        });

        document.getElementById("input").addEventListener("input", function() {
            if (this.value.toLowerCase() === currentWord.romaji) {
                score += 10;
                document.getElementById("score").textContent = score;
                this.value = "";
                newWord();
            }
        });
    </script>
</body>
</html>
