<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タイピングゲーム</title>
    <style>
        body { text-align: center; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #container { display: flex; flex-direction: column; align-items: center; }
        #word { font-size: 28px; font-weight: bold; margin: 20px; display: none; }
        #romaji { font-size: 22px; color: gray; display: none; }
        #input { font-size: 20px; padding: 8px; width: 300px; text-align: center; display: none; }
        #startMessage { font-size: 22px; color: red; margin-bottom: 20px; }
        #stats { margin-top: 20px; font-size: 18px; }
    </style>
</head>
<body>
    <h1>タイピングゲーム</h1>
    <p id="startMessage">スペースキーを押してゲームを開始</p>
    <p>表示される単語のローマ字を正しく入力してください</p>
    <div id="word">準備中...</div>
    <div id="romaji"></div>
    <input type="text" id="input" autofocus>
    <p>スコア: <span id="score">0</span></p>
    <p>残り時間: <span id="timer">120</span>秒</p>
    
    <script>
        const words = [
            { kanji: "北海道・札幌", romaji: "hokkaido sapporo" },
            { kanji: "青森県・青森", romaji: "aomori aomori" },
            { kanji: "岩手県・盛岡", romaji: "iwate morioka" },
            { kanji: "宮城県・仙台", romaji: "miyagi sendai" },
            { kanji: "秋田県・秋田", romaji: "akita akita" },
            { kanji: "山形県・山形", romaji: "yamagata yamagata" },
            { kanji: "福島県・福島", romaji: "fukushima fukushima" },
            { kanji: "茨城県・水戸", romaji: "ibaraki mito" },
            { kanji: "栃木県・宇都宮", romaji: "tochigi utsunomiya" },
            { kanji: "群馬県・前橋", romaji: "gunma maebashi" },
            { kanji: "埼玉県・さいたま", romaji: "saitama saitama" },
            { kanji: "千葉県・千葉", romaji: "chiba chiba" },
            { kanji: "東京都・東京", romaji: "tokyo tokyo" },
            { kanji: "神奈川県・横浜", romaji: "kanagawa yokohama" },
            { kanji: "新潟県・新潟", romaji: "niigata niigata" },
            { kanji: "富山県・富山", romaji: "toyama toyama" },
            { kanji: "石川県・金沢", romaji: "ishikawa kanazawa" },
            { kanji: "福井県・福井", romaji: "fukui fukui" },
            { kanji: "山梨県・甲府", romaji: "yamanashi kofu" },
            { kanji: "長野県・長野", romaji: "nagano nagano" },
            { kanji: "岐阜県・岐阜", romaji: "gifu gifu" },
            { kanji: "静岡県・静岡", romaji: "shizuoka shizuoka" },
            { kanji: "愛知県・名古屋", romaji: "aichi nagoya" },
            { kanji: "三重県・津", romaji: "mie tsu" },
            { kanji: "滋賀県・大津", romaji: "shiga otsu" },
            { kanji: "京都府・京都", romaji: "kyoto kyoto" },
            { kanji: "大阪府・大阪", romaji: "osaka osaka" },
            { kanji: "兵庫県・神戸", romaji: "hyogo kobe" },
            { kanji: "奈良県・奈良", romaji: "nara nara" },
            { kanji: "和歌山県・和歌山", romaji: "wakayama wakayama" },
            { kanji: "鳥取県・鳥取", romaji: "tottori tottori" },
            { kanji: "島根県・松江", romaji: "shimane matsue" },
            { kanji: "岡山県・岡山", romaji: "okayama okayama" },
            { kanji: "広島県・広島", romaji: "hiroshima hiroshima" },
            { kanji: "山口県・山口", romaji: "yamaguchi yamaguchi" },
            { kanji: "徳島県・徳島", romaji: "tokushima tokushima" },
            { kanji: "香川県・高松", romaji: "kagawa takamatsu" },
            { kanji: "愛媛県・松山", romaji: "ehime matsuyama" },
            { kanji: "高知県・高知", romaji: "kochi kochi" },
            { kanji: "福岡県・福岡", romaji: "fukuoka fukuoka" },
            { kanji: "佐賀県・佐賀", romaji: "saga saga" },
            { kanji: "長崎県・長崎", romaji: "nagasaki nagasaki" },
            { kanji: "熊本県・熊本", romaji: "kumamoto kumamoto" },
            { kanji: "大分県・大分", romaji: "oita oita" },
            { kanji: "宮崎県・宮崎", romaji: "miyazaki miyazaki" },
            { kanji: "鹿児島県・鹿児島", romaji: "kagoshima kagoshima" },
            { kanji: "沖縄県・那覇", romaji: "okinawa naha" }
        ];
        let currentWord = {};
        let score = 0;
        let timeLeft = 120;
        let gameStarted = false;
        let timerInterval;

        function newWord() {
            currentWord = words[Math.floor(Math.random() * words.length)];
            document.getElementById("word").textContent = currentWord.kanji;
            document.getElementById("romaji").textContent = currentWord.romaji;
            document.getElementById("input").value = "";
        }

        function updateTimer() {
            if (timeLeft > 0) {
                timeLeft--;
                document.getElementById("timer").textContent = timeLeft;
            } else {
                clearInterval(timerInterval);
                window.location.href = `result.html?score=${score}`;
            }
        }

        function startGame() {
            if (!gameStarted) {
                gameStarted = true;
                document.getElementById("startMessage").style.display = "none";
                document.getElementById("word").style.display = "block";
                document.getElementById("romaji").style.display = "block";
                document.getElementById("input").style.display = "block";
                document.getElementById("input").focus();
                newWord();
                timerInterval = setInterval(updateTimer, 1000);
            }
        }

        document.addEventListener("keydown", function(event) {
            if (event.code === "Space") {
                startGame();
            }
        });

        document.getElementById("input").addEventListener("input", function() {
            if (this.value.toLowerCase() === currentWord.romaji) {
                score += 10;
                document.getElementById("score").textContent = score;
                this.value = "";
                newWord();
            }
        });
    </script>
</body>
</html>
